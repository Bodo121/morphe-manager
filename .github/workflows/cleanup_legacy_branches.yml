name: One-time branch cleanup after verified SakuraPatcher build

on:
  workflow_run:
    workflows:
      - Build SakuraPatcher debug APK
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update GitHub repository description if permissions allow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh api --method PATCH "repos/$GH_REPO" \
              -f description="SakuraPatcher 🌸 — unofficial Android APK patch manager with advanced compatibility overrides and a lightweight interface" \
              -f homepage="https://github.com/Bodo121/morphe-manager"; then
            echo "Repository description updated"
          else
            echo "Description update needs repository administration permission; change it from GitHub About settings." >&2
          fi
      - name: Delete legacy branches, preserve main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          for branch in 'crowdin' 'dev' 'doom-on-morphe' 'feat/official-signing-key' 'feature/cross-package-patches'; do
            echo "Deleting refs/heads/$branch if permitted"
            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"; then
              echo "Deleted $branch"
            else
              echo "Failed or branch absent: $branch" >&2
            fi
          done
