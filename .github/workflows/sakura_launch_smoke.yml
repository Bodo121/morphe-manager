name: SakuraPatcher Android launch smoke test

# Does not slow ordinary debug APK builds. Run manually before a release.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug --build-cache --console=plain

      - name: Enable emulator acceleration
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -n app.morphe.manager.debug/app.morphe.manager.MainActivity
            sleep 12
            adb logcat -d -b crash -v time > sakura-emulator-crash.log || true
            if ! adb shell pidof app.morphe.manager.debug; then
              echo "SakuraPatcher process exited during initial launch"
              cat sakura-emulator-crash.log
              exit 1
            fi
            echo "SakuraPatcher process remained alive after launch"
      - name: Upload launch crash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-emulator-crash-log
          path: sakura-emulator-crash.log
          if-no-files-found: ignore
