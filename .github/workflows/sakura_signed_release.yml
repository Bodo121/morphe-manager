name: SakuraPatcher signed release APK
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Require stable release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEYSTORE_ENTRY_ALIAS" || -z "$KEYSTORE_ENTRY_PASSWORD" ]]; then
            echo "::error::Provide stable KEYSTORE_B64, KEYSTORE_PASSWORD, KEYSTORE_ENTRY_ALIAS and KEYSTORE_ENTRY_PASSWORD repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/keystore.jks
          chmod 600 app/keystore.jks
      - name: Build production-signed optimized APK
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --build-cache --stacktrace --console=plain
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SakuraPatcher-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
