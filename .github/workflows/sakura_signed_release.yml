name: Publish SakuraPatcher release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: sakura-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Cache Gradle build
        uses: gradle/actions/setup-gradle@v4

      - name: Configure permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEYSTORE_ENTRY_ALIAS" || -z "$KEYSTORE_ENTRY_PASSWORD" ]]; then
            echo "::error::A signed installable release needs a persistent keystore. Configure KEYSTORE_B64, KEYSTORE_PASSWORD, KEYSTORE_ENTRY_ALIAS and KEYSTORE_ENTRY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/keystore.jks
          chmod 600 app/keystore.jks
          keytool -list -keystore app/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ENTRY_ALIAS" > /dev/null

      # Debug/test APKs aren't published, and unit tests remain manual as requested.
      - name: Build optimized, signed, non-debug release APK
        timeout-minutes: 35
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          _JAVA_OPTIONS: -Djava.awt.headless=true
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --build-cache --stacktrace --console=plain --profile

      - name: Verify Android signature and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          ID=$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          test "$ID" = "app.morphe.manager" || { echo "::error::Release has wrong package ID: $ID"; exit 1; }
          cp "$APK" "SakuraPatcher-release.apk"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraPatcher-release
          path: SakuraPatcher-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v2.2.0-sakura.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" SakuraPatcher-release.apk \
            --target "$GITHUB_SHA" \
            --title "SakuraPatcher $RELEASE_TAG" \
            --notes "SakuraPatcher optimized Android release (app.morphe.manager). Signed with the repository's persistent release key. Startup responsiveness and patch source loading refinements. Requires installation approval. If upgrading from a .debug variant, both packages are separate applications."
