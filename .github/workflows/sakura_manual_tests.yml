name: SakuraPatcher manual unit-test diagnostics

# Tests are intentionally opt-in: no test job runs on a normal main push.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Investigate unit tests (manual only, bounded)
        timeout-minutes: 16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: -Djava.awt.headless=true
        run: |
          chmod +x ./gradlew
          # Exit 124 identifies a runner/test hang without silently passing it.
          timeout --signal=TERM --kill-after=20s 14m \
            ./gradlew :app:testDebugUnitTest --info --stacktrace --console=plain --max-workers=2

      - name: Upload test reports, even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SakuraPatcher-manual-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
